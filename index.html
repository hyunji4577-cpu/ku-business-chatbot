<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>건국대학교 경영대학 이수구분 정정 도우미</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#20252a;font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif}
.app{width:min(720px,100%);height:100vh;min-height:650px;margin:auto;background:white;display:flex;flex-direction:column}
header{height:72px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid #e2e7e4}
.logo{width:36px;height:36px;border-radius:9px;background:#006633;color:white;display:grid;place-items:center;font-weight:900;font-size:12px}
header b{font-size:14px}header small{display:block;color:#8a928e;font-size:10px;margin-top:2px}
.chat{flex:1;overflow:auto;background:#fbfcfb;padding:24px 18px}
.bot,.user{display:flex;margin-bottom:14px}.bot{gap:9px}.user{justify-content:flex-end}
.avatar{width:30px;height:30px;border-radius:50%;background:#edf7f1;color:#006633;display:grid;place-items:center;font-size:11px;font-weight:900;flex:none}
.bubble{max-width:590px;padding:13px 14px;border:1px solid #e2e7e4;border-radius:4px 13px 13px 13px;background:white;font-size:13px;line-height:1.7}
.user .bubble{background:#006633;color:white;border:0;border-radius:13px 4px 13px 13px}
.menu{margin-left:39px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
button{font-family:inherit}.choice{background:white;border:1px solid #d9e2dc;border-radius:10px;padding:12px;text-align:left;font-size:12px;font-weight:800;color:#37413b;cursor:pointer}.choice:hover{border-color:#006633;background:#edf7f1}.choice span{display:block;color:#8a938e;font-size:10px;font-weight:400;margin-top:3px}
.selector{margin-left:39px;margin-bottom:18px;padding:13px;background:white;border:1px solid #e2e7e4;border-radius:11px}.selector-title{font-size:12px;font-weight:800;margin-bottom:8px}.row{display:flex;gap:7px}.selector select,.selector input{height:40px;flex:1;border:1px solid #d6ded9;border-radius:8px;padding:0 10px;font-size:12px;outline:0}.next{height:40px;border:0;border-radius:8px;background:#006633;color:white;padding:0 14px;font-size:12px;font-weight:800;cursor:pointer}
.result{margin-top:7px}.item{border:1px solid #e2e7e4;border-radius:9px;padding:11px;margin-top:7px}.item-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.subject{font-weight:900}.badges{display:flex;gap:4px;flex-wrap:wrap}.badge{background:#edf7f1;border:1px solid #d4e8dc;color:#006633;border-radius:5px;padding:3px 6px;font-size:10px;font-weight:900}.meta{font-size:11px;color:#7a837e;margin-top:4px}
.proc{display:flex;gap:9px;margin:9px 0}.num{width:23px;height:23px;background:#006633;color:white;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:900;flex:none}.proc b{font-size:12px}.proc p{margin:1px 0;color:#737c77;font-size:11px}
.faq{border:1px solid #e2e7e4;border-radius:8px;padding:10px;margin-top:7px}.faq b{font-size:12px}.faq p{margin:3px 0 0;color:#737c77;font-size:11px}
.inputbar{display:flex;gap:7px;padding:11px 15px;border-top:1px solid #e2e7e4}.inputbar input{height:44px;flex:1;border:1px solid #d6ded9;border-radius:9px;padding:0 12px;font-size:13px;outline:0}.send{width:60px;border:0;border-radius:9px;background:#006633;color:white;font-weight:800;cursor:pointer}
@media(max-width:560px){.menu{grid-template-columns:1fr;margin-left:39px}.row{flex-direction:column}.next{width:100%}.chat{padding:20px 13px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">KU</div><div><b>건국대학교 경영대학</b><small>이수구분 정정 도우미</small></div></header>

</div>

const chat=document.getElementById("chat"), input=document.getElementById("input");

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function badges(v){return String(v||"-").split(",").map(s=>s.trim()).filter(Boolean).map(s=>'<span class="badge">'+esc(s)+'</span>').join("")}
function bot(html){chat.insertAdjacentHTML("beforeend",'<div class="bot"><div class="avatar">KU</div><div class="bubble">'+html+'</div></div>');chat.scrollTop=chat.scrollHeight}
function user(t){chat.insertAdjacentHTML("beforeend",'<div class="user"><div class="bubble">'+esc(t)+'</div></div>');chat.scrollTop=chat.scrollHeight}

function menu(){
 chat.insertAdjacentHTML("beforeend",'<div class="menu">'+
 '<button class="choice" onclick="startCheck()">🔎 과목 이수구분 확인<span>학과 → 입학년도 → 과목명</span></button>'+
 '<button class="choice" onclick="procedure()">📋 이수구분 정정 절차 안내<span>정정 신청 방법 확인</span></button>'+
 '<button class="choice" onclick="qa()">💬 Q&A<span>자주 묻는 질문 확인</span></button>'+
 '</div>');
}

function startCheck(){
 user("과목 이수구분을 확인하고 싶어요.");
 const depts=[...new Set(DATA.map(x=>x["학과"]).filter(Boolean))].sort();
 bot("<b>① 학과를 선택해주세요.</b>");
 chat.insertAdjacentHTML("beforeend",'<div class="selector"><div class="selector-title">학과 선택</div><div class="row"><select id="dept"><option value="">학과를 선택하세요</option>'+depts.map(x=>'<option>'+esc(x)+'</option>').join("")+'</select><button class="next" onclick="nextYear()">다음</button></div></div>');
 chat.scrollTop=chat.scrollHeight;
}

function nextYear(){
 const d=document.getElementById("dept").value;
 if(!d){alert("학과를 선택해주세요.");return}
 user(d);
 window.selectedDept=d;
 bot("<b>② 입학년도를 선택해주세요.</b><br><span style='font-size:11px;color:#737c77'>다전공(복수전공·부전공 등)은 <b>선발년도</b>를 선택해주세요.</span>");
 const years=[...new Set(DATA.filter(x=>x["학과"]===d).map(x=>String(x["입학년도"])).filter(Boolean))].sort((a,b)=>a-b);
 chat.insertAdjacentHTML("beforeend",'<div class="selector"><div class="selector-title">입학년도 · 다전공은 선발년도</div><div class="row"><select id="year"><option value="">연도를 선택하세요</option>'+years.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'학년도</option>').join("")+'</select><button class="next" onclick="nextSubject()">다음</button></div></div>');
 chat.scrollTop=chat.scrollHeight;
}

function nextSubject(){
 const y=document.getElementById("year").value;
 if(!y){alert("연도를 선택해주세요.");return}
 user(y+"학년도");
 window.selectedYear=y;
 bot("<b>③ 과목명을 입력해주세요.</b><br><span style='font-size:11px;color:#737c77'>과목명 일부만 입력해도 검색할 수 있습니다.</span>");
 chat.insertAdjacentHTML("beforeend",'<div class="selector"><div class="selector-title">과목명</div><div class="row"><input id="subject" placeholder="예: 경영학원론"><button class="next" onclick="findSubject()">확인</button></div></div>');
 chat.scrollTop=chat.scrollHeight;
}

function findSubject(){
 const q=document.getElementById("subject").value.trim();
 if(!q){alert("과목명을 입력해주세요.");return}
 user(q);
 const arr=DATA.filter(x=>x["학과"]===window.selectedDept&&String(x["입학년도"])===window.selectedYear&&String(x["과목명"]).toLowerCase().includes(q.toLowerCase())).slice(0,30);
 if(!arr.length){bot("해당 조건에서 <b>"+esc(q)+"</b> 과목을 찾지 못했어요.<br><span style='font-size:11px;color:#737c77'>과목명을 다시 확인해주세요.</span>");return}
 let h="<b>"+esc(window.selectedYear)+"학년도 · "+esc(window.selectedDept)+"</b><div class='result'>";
 arr.forEach(x=>h+='<div class="item"><div class="item-top"><span class="subject">'+esc(x["과목명"])+'</span><span class="badges">'+badges(x["이수구분"])+'</span></div><div class="meta">'+(x["학점"]?esc(x["학점"])+"학점 ":"")+(x["학기"]?"· "+esc(x["학기"]):"")+'</div></div>');
 h+='</div>';
 bot(h);
}

function procedure(){
 user("이수구분 정정 절차를 알고 싶어요.");
 bot("<b>이수구분 정정 절차</b>"+
 '<div class="proc"><div class="num">1</div><div><b>취득학점확인원 출력</b><p>본인의 취득학점확인원을 출력합니다.</p></div></div>'+
 '<div class="proc"><div class="num">2</div><div><b>경영대학 행정실 방문</b><p>취득학점확인원을 가지고 행정실을 방문합니다.</p></div></div>'+
 '<div class="proc"><div class="num">3</div><div><b>신청서 작성</b><p>행정실에서 이수구분 정정 신청서를 작성합니다.</p></div></div>');
}

function qa(){
 user("Q&A를 보고 싶어요.");
 bot("<b>자주 묻는 질문</b>"+
 '<div class="faq"><b>Q. 이수구분 정정 신청 가능 시기는 언제인가요?</b><p>성적 등재 이후 신청할 수 있습니다.</p></div>'+
 '<div class="faq"><b>Q. 타과목을 수강해서 일선에 있는 과목도 정정할 수 있나요?</b><p>동일교과목인 경우 정정 가능합니다.</p></div>'+
 '<div class="faq"><b>Q. 이수구분 정정은 어떻게 신청하나요?</b><p>취득학점확인원을 출력한 후 경영대학 행정실을 방문하여 신청서를 작성합니다.</p></div>');
}

function answer(text){
 if(/정정.*(절차|방법)|신청.*(절차|방법)/.test(text)){procedure();return}
 if(/정정/.test(text)&&/(언제|시기|가능)/.test(text)){bot("<b>이수구분 정정 신청 가능 시기</b><br>성적 등재 이후 신청할 수 있습니다.");return}
 if(/일선|타과목|동일교과목/.test(text)){bot("<b>타과목 수강으로 현재 일선에 있는 과목</b><br>동일교과목인 경우 정정 가능합니다.");return}
 const lower=text.toLowerCase(), y=(text.match(/20\d\d/)||[])[0]||"", d=DATA.map(x=>x["학과"]).find(x=>x&&text.includes(x));
 const exact=DATA.map(x=>x["과목명"]).find(x=>x&&lower.includes(String(x).toLowerCase()));
 let arr;
 if(exact) arr=DATA.filter(x=>x["과목명"]===exact&&(!d||x["학과"]===d)&&(!y||String(x["입학년도"])===y));
 else {
   let type=/전필|전공필수/.test(text)?"전필":/전선|전공선택/.test(text)?"전선":"";
   arr=DATA.filter(x=>(!d||x["학과"]===d)&&(!y||String(x["입학년도"])===y)&&(!type||String(x["이수구분"]).includes(type))).slice(0,30);
 }
 if(!arr.length){bot("찾는 과목을 확인하지 못했어요.<br><span style='font-size:11px;color:#737c77'>예: 2026학년도 경영학과 경영학원론</span>");return}
 let h="<b>검색 결과입니다.</b><div class='result'>";
 arr.forEach(x=>h+='<div class="item"><div class="item-top"><span class="subject">'+esc(x["과목명"])+'</span><span class="badges">'+badges(x["이수구분"])+'</span></div><div class="meta">'+(x["입학년도"]?esc(x["입학년도"])+"학년도 ":"")+(x["학점"]?esc(x["학점"])+"학점 ":"")+(x["학과"]?"· "+esc(x["학과"]):"")+'</div></div>');
 h+='</div>';bot(h);
}

document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();const q=input.value.trim();if(!q)return;user(q);input.value="";answer(q)});
bot("안녕하세요! 👋<br><b>건국대학교 경영대학 이수구분 정정 도우미</b>입니다.<br>과목의 이수구분을 확인하거나 정정 절차와 Q&A를 안내해드릴게요.<br><br>원하는 항목을 선택해주세요.");
menu();
</script>
</body>
</html>
